name: CI

# Check the fork on Linux, Windows, and macOS. Release packaging is manual;
# end-user archives are created with the allowlisted Windows packager.

on:
  pull_request:
    branches: [v2, v3]
  push:
    branches: [v2, v3]

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # build.rs runs prost-build on liqi.proto and needs protoc on PATH.
      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The crate links tauri, so even `cargo test --lib` needs the GTK /
      # WebKit dev libs to compile. Mirrors release.yml's Linux deps
      # (minus the bundling-only patchelf / libfuse2).
      - name: Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test (lib)
        run: cargo test --lib

      # Compile every test target (integration tests, benches) without
      # running them. This is the check that would have caught the
      # spawn_with_command arity break in tests/example_bot.rs.
      - name: build all test targets
        run: cargo test --no-run --all-targets

  # Compile-only on the other two release targets. No tests, no packaging — the
  # point is purely "does this platform's cfg path still build", which is the
  # one thing the Linux gate above structurally cannot tell us. `macos-14` is
  # arm64, matching release.yml's `aarch64-apple-darwin`.
  compile:
    name: Compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # build.rs runs prost-build on liqi.proto and needs protoc on PATH.
      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # --all-targets so the bin (and its `generate_context!`) is compiled too,
      # not just the lib.
      - name: cargo check
        run: cargo check --all-targets --locked

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` is `tsc -b && vite build` — type-checks too.
      - name: Build
        run: npm run build

  majsoulmax-adapter:
    name: MajsoulMax isolated adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare isolated MajsoulMax dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r plugins/majsoulmax/requirements.txt
      - name: Protocol regression
        run: .venv/bin/python -m unittest discover -s tests -p test_majsoulmax_worker.py -v
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/majsoulmax_bridge
      - name: Real Rust and Python message bridge
        run: cargo test --manifest-path tests/majsoulmax_bridge/Cargo.toml --locked
