[package]
name = "majsoulmax-worker"
version = "0.7.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
reqwest = { version = "0.13", features = ["rustls","webpki-roots","json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["fs","rt-multi-thread","macros","sync"] }
tracing = "0.1"
const_format = "0.2"
rand = { version = "0.10", features = ["thread_rng"], default-features = false }

[build-dependencies]
prost = "0.14"
prost-build = { version = "0.14", default-features = false }
prost-types = "0.14"
